<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wands-search</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header>
    <h1>wands-search</h1>
    <p>Offline demo over WANDS, Wayfair's public product-search relevance dataset.</p>
    <form id="search-form">
      <input id="query" type="search" placeholder="try: light wood nightstand" autocomplete="off" required>
      <button type="submit">Search</button>
    </form>
    <p id="understanding"></p>
  </header>
  <main id="results"></main>
  <script src="/web/app.js"></script>
</body>
</html>
