[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wands-search"
version = "0.1.0"
description = "Hybrid product search with offline LLM query understanding, evaluated on Wayfair's public WANDS relevance labels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "bm25s>=0.3",
    "PyStemmer>=2.2",
    "sentence-transformers>=3.0",
    "google-genai>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17,<0.18", "ranx>=0.3.20"]

[project.scripts]
wands = "wands.cli:app"

[tool.setuptools.packages.find]
include = ["wands*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the typer idiom

[tool.ruff.lint.per-file-ignores]
"wands/profile.py" = ["E501"]  # long prose lines of the generated notes
